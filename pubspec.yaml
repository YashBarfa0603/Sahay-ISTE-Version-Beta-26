name: sahay
description: "SAHAY (सहाय) — Multilingual Indian Government Scheme Discovery & Eligibility Assessment"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # HTTP Client (for future FastAPI backend)
  dio: ^5.7.0

  # Typography
  google_fonts: ^6.2.1

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # PDF Generation
  pdf: ^3.11.2
  printing: ^5.13.4

  # Local Storage (language preference only)
  shared_preferences: ^2.3.4

  # Unique IDs
  uuid: ^4.5.1

  # URL Launcher
  url_launcher: ^6.3.1

  # Intl (date formatting)
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/English.jpeg
    - assets/Hindi.jpeg
    - assets/Tamil.jpeg
    - assets/Marathi.jpeg
    - assets/Bangali.jpeg
    - assets/Gujarati.jpeg
    - assets/Kannada.jpeg
    - assets/Odia.jpeg
